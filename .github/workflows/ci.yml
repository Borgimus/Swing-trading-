name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  UV_VERSION: "0.11.33"
  UV_CACHE_DIR: ${{ github.workspace }}/.uv-cache

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups
      - name: Formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type checking
        run: uv run mypy src
      - name: Unit, property, migration, and integration tests
        run: uv run pytest -q

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret - ephemeral CI database
          POSTGRES_DB: swing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d swing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/swing_test  # pragma: allowlist secret
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/swing_test  # pragma: allowlist secret
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups
      - name: Upgrade PostgreSQL schema
        run: uv run alembic upgrade head
      - name: PostgreSQL importer integration
        run: uv run pytest -q tests/test_postgres_integration.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"
      - name: Sync locked dependencies
        run: uv sync --frozen --all-groups
      - name: Secret scan
        run: uv run detect-secrets-hook --baseline .secrets.baseline $(git ls-files)
      - name: Export runtime lock
        run: >-
          uv export --frozen --no-dev --no-emit-project
          --format requirements-txt --output-file /tmp/runtime-requirements.txt
      - name: Dependency vulnerability scan
        run: >-
          uv run pip-audit --cache-dir /tmp/pip-audit-cache
          --require-hashes --disable-pip -r /tmp/runtime-requirements.txt
